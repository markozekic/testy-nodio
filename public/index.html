<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Testy pro Medu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800;900&family=Source+Serif+4:wght@400;600&display=swap">
<style>
:root{--bg:#eceff3;--surface:#fff;--ink:#151a22;--muted:#566070;--accent:#c8322b;--pick:#e9edf8;--line:#cdd3dc;
  --f-head:"Archivo","Helvetica Neue",Arial,sans-serif;--f-body:"Source Serif 4",Georgia,serif}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--surface:#1b2029;--ink:#eceff4;--muted:#9aa4b2;--accent:#ef5b52;--pick:#26304a;--line:#303846;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 56px}
h1{margin:0 0 18px;padding-bottom:16px;border-bottom:6px solid var(--ink);font-family:var(--f-head);font-weight:900;text-transform:uppercase;line-height:.95;font-size:clamp(2.1rem,9.5vw,3.4rem)}
h1 span{color:var(--accent)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
a.t{display:grid;gap:2px;background:var(--surface);border:2px solid var(--ink);padding:12px 14px;color:inherit;text-decoration:none}
a.t:hover{background:var(--pick)}
a.t b{font-family:var(--f-head);font-weight:800;font-size:1.05rem}
a.t small{color:var(--muted)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

html{scroll-padding-top:56px}
.topnav .np{margin-left:auto;align-self:center;color:var(--ink);text-decoration:none;padding:0;border:0;margin-right:0;font-variant-numeric:tabular-nums;white-space:nowrap}
.topnav .np small{color:var(--muted);font-size:.7rem;margin-right:5px}
.topnav{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:2px solid var(--line, #cdd3dc);padding-top:env(safe-area-inset-top)}
.topnav .in{max-width:720px;margin:0 auto;padding-inline:16px;display:flex;gap:4px;font-family:var(--f-head);font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
.topnav a{color:var(--ink);text-decoration:none;padding:14px 12px 11px 0;margin-right:12px;border-bottom:3px solid transparent;margin-bottom:-2px}
.topnav a:hover{border-bottom-color:var(--muted)}
.topnav a[aria-current="page"]{border-bottom-color:var(--accent)}
</style>
</head>
<body>
<nav class="topnav" aria-label="Hlavní navigace"><div class="in"><a href="/" aria-current="page">Testy</a><a href="/vysvedceni/">Vysvědčení</a><a class="np" id="np" href="/vysvedceni/" hidden></a></div></nav>
<div class="wrap">
  <h1>Testy<br><span>pro Medu</span></h1>
  <ul>
    <li><a class="t" href="dvk-dada-devetsil-surrealismus/"><b>Dada, Devětsil, surrealismus</b><small>Dějiny výtvarné kultury · 50 otázek · příprava na test 13. 10.</small></a></li>
  </ul>
</div>
<script>
(function () {
  function refreshPts() {
    if (typeof fetch !== "function") return;
    fetch("/vysvedceni/data.json?" + Date.now()).then(r => r.ok ? r.json() : Promise.reject()).then(d => {
      const el = document.getElementById("np");
      if (!el || typeof d.points !== "number") return;
      el.innerHTML = "<small>Body</small>" + d.points + "/" + (d.goal || 100);
      el.title = "Získané body za všechny testy";
      el.hidden = false;
    }).catch(() => {});
  }
  window.refreshPts = refreshPts; refreshPts();
})();
</script>
</body>
</html>
