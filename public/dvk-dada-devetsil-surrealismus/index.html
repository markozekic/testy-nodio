<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Dada Devětsil Surrealismus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Source+Serif+4:wght@400;600&display=swap">
<style>
/* Layout: one narrow column, constructivist headline block, flat answer chips. Red is the only accent. */
:root{
  --bg:#eceff3; --surface:#ffffff; --ink:#151a22; --muted:#566070; --line:#cdd3dc;
  --accent:#c8322b; --accent-ink:#ffffff; --link:#2447a8;
  --good:#1c7448; --good-bg:#e1f3ea; --bad:#b3261e; --bad-bg:#fbe6e4; --pick:#e9edf8;
  --f-head:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12151b; --surface:#1b2029; --ink:#eceff4; --muted:#9aa4b2; --line:#303846;
  --accent:#ef5b52; --accent-ink:#12151b; --link:#93abff;
  --good:#6fd1a0; --good-bg:#17332a; --bad:#ff9189; --bad-bg:#3a1f1f; --pick:#26304a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151b; --surface:#1b2029; --ink:#eceff4; --muted:#9aa4b2; --line:#303846;
  --accent:#ef5b52; --accent-ink:#12151b; --link:#93abff;
  --good:#6fd1a0; --good-bg:#17332a; --bad:#ff9189; --bad-bg:#3a1f1f; --pick:#26304a; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:20px 56px}
a{color:var(--link)}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.mast{display:grid;gap:14px;padding-bottom:18px;border-bottom:6px solid var(--ink);margin-bottom:22px}
.mast h1{margin:0;font-family:var(--f-head);font-weight:900;text-transform:uppercase;line-height:.92;letter-spacing:-.01em;font-size:clamp(2.1rem,9.5vw,3.6rem)}
.mast h1 span{display:block}
.mast h1 span:nth-child(2){color:var(--accent);padding-left:.6em}
.mast h1 span:nth-child(3){padding-left:1.2em}
.mast p{margin:0;font-family:var(--f-head);font-weight:500;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.lead{margin:0 0 18px;max-width:60ch}
.modes{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.mode{display:grid;gap:2px;text-align:left;background:var(--surface);border:2px solid var(--ink);border-radius:2px;padding:12px 14px;cursor:pointer}
.mode:hover{background:var(--pick)}
.mode b{font-family:var(--f-head);font-weight:800;font-size:1.02rem;line-height:1.2}
.mode small{color:var(--muted);font-size:.9rem}
.mode.all{grid-column:1/-1;background:var(--ink);color:var(--bg)}
.mode.all small{color:inherit;opacity:.8}
.mode.all:hover{background:var(--accent);color:var(--accent-ink)}
.foot{margin-top:26px;color:var(--muted);font-size:.85rem}

.bar{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-family:var(--f-head);font-weight:700;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.track{flex:1;height:8px;background:var(--line);border-radius:1px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.quit{background:none;border:0;padding:4px 0;cursor:pointer;color:var(--muted);text-decoration:underline;font-family:var(--f-head);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}

.card{background:var(--surface);border:2px solid var(--ink);border-radius:2px;padding:16px;display:grid;gap:14px;min-width:0}
.tag{font-family:var(--f-head);font-weight:800;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.prompt{margin:0;font-size:1.15rem;font-weight:600}
.fig{margin:0;display:grid;gap:6px;justify-items:center}
.fig img{max-height:min(62vh,520px);width:auto;max-width:100%;height:auto;border:1px solid var(--line);background:#fff}
.fig figcaption{font-size:.78rem;color:var(--muted);text-align:center}
.imgfail{border:2px dashed var(--line);padding:14px;font-size:.95rem}
.desc{border-left:6px solid var(--ink);padding:6px 0 6px 14px;font-style:italic}

.field{display:grid;gap:8px;min-width:0}
.field>.lab{font-family:var(--f-head);font-weight:800;font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chips{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.chip{background:var(--surface);border:2px solid var(--line);border-radius:2px;padding:9px 12px;text-align:left;cursor:pointer;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--pick)}
.chip.ok{border-color:var(--good);background:var(--good-bg)}
.chip.no{border-color:var(--bad);background:var(--bad-bg)}
.chip:disabled{cursor:default}
.row{display:grid;gap:6px;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);align-items:center}
.row select{width:100%;padding:9px 10px;border:2px solid var(--line);border-radius:2px;background:var(--surface);min-width:0}
.row select.ok{border-color:var(--good);background:var(--good-bg)}
.row select.no{border-color:var(--bad);background:var(--bad-bg)}
.row .fix{grid-column:1/-1;font-size:.9rem;color:var(--good)}
@media (max-width:520px){.row{grid-template-columns:1fr}}

.ord{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ord li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border:2px solid var(--line);padding:8px 10px;background:var(--surface)}
.ord li.ok{border-color:var(--good);background:var(--good-bg)}
.ord li.no{border-color:var(--bad);background:var(--bad-bg)}
.ord .yr{font-family:var(--f-head);font-weight:800;margin-right:8px}
.mv{display:flex;gap:6px}
.mv button{width:40px;height:40px;border:2px solid var(--ink);background:var(--surface);cursor:pointer;font-size:1rem;line-height:1}
.mv button:disabled{opacity:.3;cursor:default}

.act{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{background:var(--ink);color:var(--bg);border:2px solid var(--ink);border-radius:2px;padding:10px 18px;cursor:pointer;font-family:var(--f-head);font-weight:800;font-size:.9rem;letter-spacing:.06em;text-transform:uppercase}
.btn:hover:not(:disabled){background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:transparent;color:var(--ink)}
a.btn{display:inline-block;text-decoration:none}
.pts{display:grid;gap:6px;margin:0 0 18px;font-family:var(--f-head);font-size:.8rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.pts .track{height:10px}
.pts a{color:inherit}
.fb{border:2px solid var(--ink);padding:12px 14px;display:grid;gap:8px}
.fb.good{border-color:var(--good);background:var(--good-bg)}
.fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb strong{font-family:var(--f-head);font-weight:800;text-transform:uppercase;letter-spacing:.04em;font-size:.9rem}
.fb p{margin:0}
.src{font-size:.82rem;color:var(--muted)}
.src a{margin-right:10px}

.score{font-family:var(--f-head);font-weight:900;font-size:clamp(3rem,16vw,5.5rem);line-height:1}
.score small{font-size:.3em;font-weight:700;color:var(--muted)}
table.sec{width:100%;border-collapse:collapse;font-size:.95rem}
table.sec td{padding:7px 4px;border-bottom:1px solid var(--line)}
table.sec td:last-child{text-align:right;font-family:var(--f-head);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.mist{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.mist li{border-left:6px solid var(--bad);padding:4px 0 4px 12px}
.mist b{font-weight:600}
.mist span{display:block;color:var(--muted);font-size:.9rem}
@media (prefers-reduced-motion:reduce){.track i{transition:none}}

.topnav{display:flex;gap:4px;margin:-4px 0 18px;padding-bottom:10px;border-bottom:2px solid var(--line, #cdd3dc);font-family:var(--f-head);font-weight:800;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}
.topnav a{color:var(--ink);text-decoration:none;padding:6px 12px 6px 0;margin-right:12px;border-bottom:3px solid transparent}
.topnav a:hover{border-bottom-color:var(--muted)}
.topnav a[aria-current="page"]{border-bottom-color:var(--accent)}
</style>
</head>

<div class="wrap">
  <nav class="topnav" aria-label="Hlavní navigace"><a href="/" aria-current="page">Testy</a><a href="/vysvedceni/">Vysvědčení</a></nav>
  <header class="mast">
    <h1><span>Dada</span><span>Devětsil</span><span>Surrealismus</span></h1>
    <p>Poznávací test z dějin výtvarné kultury · příprava na 13. 10.</p>
  </header>
  <main id="app"></main>
</div>

<script>
/* ============ DATA ============ */
const S = {
  zuerich:{l:"Zürich turismus: Dada",u:"https://www.zuerich.com/en/visit/explore/dada"},
  dada:{l:"Wikipedia: Dada",u:"https://en.wikipedia.org/wiki/Dada"},
  nyb:{l:"The New York Review of Books: Dada v Curychu",u:"https://www.nybooks.com/?p=33953"},
  fountain:{l:"Wikipedia: Fountain",u:"https://en.wikipedia.org/wiki/Fountain_(Duchamp)"},
  ready:{l:"Wikipedia: Readymades of Marcel Duchamp",u:"https://en.wikipedia.org/wiki/Readymades_of_Marcel_Duchamp"},
  merz:{l:"Museo Thyssen: Merzbild 1A",u:"https://museothyssen.org/node/17062"},
  picabia:{l:"Artchive: Love Parade",u:"https://www.artchive.com/artwork/love-parade-francis-picabia-1917/"},
  hoech:{l:"German History Docs: Höch, 1919",u:"https://germanhistorydocs.org/en/weimar-germany-1918-1933/hannah-hoech-cut-with-the-dada-kitchen-knife-through-the-last-weimar-beer-belly-cultural-epoch-in-germany-1919"},
  hausmann:{l:"Wikipedia: Raoul Hausmann",u:"https://en.wikipedia.org/wiki/Raoul_Hausmann"},
  ernst:{l:"Wikipedia: Max Ernst",u:"https://en.wikipedia.org/wiki/Max_Ernst"},
  poetism:{l:"Wikipedia: Poetism",u:"https://en.wikipedia.org/wiki/Poetism"},
  ct24:{l:"ČT24: Poetismus vznikl na půdě Devětsilu",u:"https://ct24.ceskatelevize.cz/clanek/kultura/literarni-smer-poetismus-vznikl-na-pude-devetsilu-karla-teigeho-215262"},
  monoskop:{l:"Monoskop: Czechia",u:"https://monoskop.org/Czechia"},
  devwiki:{l:"Wikipedia: Devětsil",u:"https://en.wikipedia.org/wiki/Dev%C4%9Btsil"},
  theatre:{l:"Wikipedia: Osvobozené divadlo",u:"https://en.wikipedia.org/wiki/Liberated_Theatre"},
  sleep:{l:"Wikipedia: Sleepwalker (Štyrský)",u:"https://en.wikipedia.org/wiki/Sleepwalker_(%C5%A0tyrsk%C3%BD)"},
  kuh:{l:"Kunsthalle Praha: Štyrský",u:"https://emuseum.kunsthallepraha.org/en/objects/details/10"},
  kuh2:{l:"Kunsthalle Praha: Štyrský (Černý Pierot)",u:"https://emuseum.kunsthallepraha.org/en/objects/details/36"},
  toyen:{l:"Galerie Kvary: Toyen",u:"https://galeriekvary.cz/wp-content/uploads/2017/03/Toyen-1.pdf"},
  buffalo:{l:"Buffalo AKG: Yves Tanguy",u:"https://buffaloakg.org/node/13937"},
  lacma:{l:"LACMA: The Treachery of Images",u:"https://www.lacma.org/node/40094"},
  persist:{l:"Wikipedia: The Persistence of Memory",u:"https://en.wikipedia.org/wiki/The_Persistence_of_Memory"},
  surr:{l:"Wikipedia: Surrealism",u:"https://en.wikipedia.org/wiki/Surrealism"},
  poets:{l:"Poets.org: stručný průvodce surrealismem",u:"https://poets.org/poetsorg/text/brief-guide-surrealism"},
  breton:{l:"Poets.org: André Breton",u:"https://poets.org/node/44783"},
  bohemia:{l:"Bohemia: Surrealismus v ČSR (1934)",u:"https://www.bohemia-online.de/index.php/bohemia/article/download/7691/11856"},
  skupina:{l:"Databáze výstav: první výstava Skupiny surrealistů",u:"https://databazevystav.udu.cas.cz/en/detail/prvni-vystava-skupiny-surrealistu-v-csr"},
  univ:{l:"Encyclopædia Universalis: avantgarda východní Evropy",u:"https://www.universalis.fr/encyclopedie/avant-garde-est-europeenne/4-les-annees-1930-les-voies-nouvelles-le-surrealisme/"},
  zam:{l:"Školní podklady: český surrealismus (PDF)",u:"https://intranet.zamecek.cz/dum/DVK13/20-CESKY_SURREALISMUS.pdf"}
};

const F = (label, right, wrong) => ({label, o:[right, ...wrong], a:0});
const DIR = ["Dada","Poetismus (Devětsil)","Artificialismus","Surrealismus"];
const dirF = c => F("Směr", c, DIR.filter(d => d !== c));

const BANK = [
/* ---------- OBRÁZKY ---------- */
{type:"fields",sec:"obr",file:"Marcel Duchamp, 1917, Fountain, photograph by Alfred Stieglitz.jpg",
 fields:[F("Autor","Marcel Duchamp",["Man Ray","Francis Picabia","Hans Arp"]),
         F("Název","Fountain (Fontána)",["Bicycle Wheel (Bicyklové kolo)","Bottle Rack (Sušák na lahve)","Mechanická hlava"]),
         dirF("Dada")],
 why:"Pisoár podepsaný „R. Mutt“, který Duchamp v roce 1917 poslal na výstavu Society of Independent Artists v New Yorku. Je to ready-made: běžný předmět povýšený na umění tím, že ho umělec vybere. Originál se ztratil, dochovala se jen tato fotografie Alfreda Stieglitze.",
 src:[S.fountain,S.ready]},

{type:"fields",sec:"obr",file:"Merzbild 1A (The Psychiatrist) (1919).jpg",
 fields:[F("Autor","Kurt Schwitters",["Hannah Höch","Raoul Hausmann","Max Ernst"]),
         F("Název","Merzbild 1A (Psychiatr)",["Řez kuchyňským nožem","Mechanická hlava (Duch naší doby)","Parade amoureuse"]),
         dirF("Dada")],
 why:"Kurt Schwitters, 1919: olej, asambláž a koláž z předmětů na plátně (mimo jiné podložka pod pivo, drát, novinové útržky a kovové části). Patří k prvním pracím ve stylu Merz. Schwitters skládal umělecké celky z odpadu a nalezených materiálů.",
 src:[S.merz]},

{type:"fields",sec:"obr",file:"Francis Picabia, 1917 - Parade amoureuse - Love parade.jpg",
 fields:[F("Autor","Francis Picabia",["Marcel Duchamp","Man Ray","Max Ernst"]),
         F("Název","Parade amoureuse (Love Parade)",["Cadeau (Dárek)","Bicycle Wheel (Bicyklové kolo)","Merzbild 1A"]),
         dirF("Dada")],
 why:"Francis Picabia, 1917, olej na kartonu. Strojové součástky spojené s milostným tématem a ironickým názvem jsou typické pro jeho dadaistickou tvorbu.",
 src:[S.picabia]},

{type:"fields",sec:"obr",file:"Teige, Odjezd na Kytheru (Departure for Cythera) (1923–24). Prague City Gallery.png",
 fields:[F("Autor","Karel Teige",["Jindřich Štyrský","Toyen","Vítězslav Nezval"]),
         F("Název","Odjezd na Kytheru",["Pozdrav z cesty","Náměsíčná","Hlas lesa"]),
         dirF("Poetismus (Devětsil)")],
 why:"Karel Teige, 1923–24, koláž a obrazová báseň (Galerie hlavního města Prahy). Obrazová báseň je typická forma poetismu: spojuje báseň, koláž, fotografii a další tištěný materiál.",
 src:[S.poetism]},

{type:"fields",sec:"obr",file:"Karel Teige, Pozdrav z cesty, 1923, koláž, papír, 33,1 x 23,5 cm, GHMP.png",
 fields:[F("Autor","Karel Teige",["Jindřich Štyrský","Toyen","Jaroslav Seifert"]),
         F("Název","Pozdrav z cesty",["Odjezd na Kytheru","Náměsíčná","Hlas lesa"]),
         dirF("Poetismus (Devětsil)")],
 why:"Karel Teige, obrazová báseň z let 1923–24 (zdroje datum uvádějí různě). Spojuje fotografii, mapu, korespondenci a symboly cestování. Jde o ukázku poetismu.",
 src:[S.poetism,S.ct24]},

{type:"fields",sec:"obr",file:"Jindřich Štyrský - Náměsíčná (1925).jpg",
 fields:[F("Autor","Jindřich Štyrský",["Toyen","Karel Teige","Josef Šíma"]),
         F("Název","Náměsíčná",["Pozdrav z cesty","Odjezd na Kytheru","Hlas lesa"]),
         dirF("Artificialismus")],
 why:"Jindřich Štyrský, 1925, olej na plátně (Moravská galerie v Brně). Štyrský a Toyen v té době rozvíjeli artificialismus, básnickou malbu, která nekopíruje skutečnost.",
 src:[S.sleep,S.kuh]},

{type:"fields",sec:"obr",file:"Yves Tanguy - Divisibilité indéfinie (1942).jpg",
 fields:[F("Autor","Yves Tanguy",["Salvador Dalí","René Magritte","Joan Miró"]),
         F("Název","Divisibilité indéfinie (Nekonečná dělitelnost)",["Persistence paměti","Zrada obrazů","Anatomie jako nevěsta"]),
         dirF("Surrealismus")],
 why:"Yves Tanguy, 1942, olej na plátně (Buffalo AKG Art Museum). Tanguy patřil od roku 1925 k pařížské surrealistické skupině. Typické jsou pusté snové krajiny s neurčitými, zvláštními tvary.",
 src:[S.buffalo]},

/* ---------- DÍLA PODLE POPISU ---------- */
{type:"fields",sec:"popis",desc:"Rozteklé kapesní hodinky v pusté krajině, jedny pokryté mravenci. Uprostřed leží zdeformovaná tvář.",
 link:{l:"Podívat se na dílo (Wikipedia)",u:"https://en.wikipedia.org/wiki/The_Persistence_of_Memory"},
 fields:[F("Autor","Salvador Dalí",["René Magritte","Joan Miró","Yves Tanguy"]),
         F("Název","Persistence paměti (La persistance de la mémoire)",["Zrada obrazů","Divisibilité indéfinie","Hlas lesa"]),
         dirF("Surrealismus")],
 why:"Salvador Dalí, 1931, olej na plátně, Museum of Modern Art v New Yorku. Rok předtím Dalí vyvinul paranoicko-kritickou metodu.",
 src:[S.persist]},

{type:"fields",sec:"popis",desc:"Realisticky namalovaná dýmka a pod ní nápis „Ceci n'est pas une pipe“ (To není dýmka).",
 link:{l:"Podívat se na dílo (LACMA)",u:"https://www.lacma.org/node/40094"},
 fields:[F("Autor","René Magritte",["Salvador Dalí","Max Ernst","Yves Tanguy"]),
         F("Název","Zrada obrazů (La trahison des images)",["Persistence paměti","Mechanická hlava","Fontána"]),
         dirF("Surrealismus")],
 why:"René Magritte (Belgie), 1929, olej na plátně, LACMA v Los Angeles. Obraz dýmky není dýmka. Dílo ukazuje rozdíl mezi zobrazením a skutečností.",
 src:[S.lacma]},

{type:"fields",sec:"popis",desc:"Fotomontáž z časopiseckých fotografií: císař Vilém II., Hindenburg a Ebert mezi ozubenými koly a stroji.",
 link:{l:"Podívat se na dílo (German History Docs)",u:S.hoech.u},
 fields:[F("Autor","Hannah Höch",["Raoul Hausmann","Kurt Schwitters","Man Ray"]),
         F("Název","Řez kuchyňským nožem Dada skrz poslední výmarskou pivobřichou kulturní epochu v Německu",["Merzbild 1A (Psychiatr)","Parade amoureuse","Pozdrav z cesty"]),
         dirF("Dada")],
 why:"Hannah Höch, 1919, fotomontáž (Nationalgalerie Berlín). Patří k nejznámějším dílům berlínského dada a je komentářem k době Výmarské republiky.",
 src:[S.hoech]},

{type:"fields",sec:"popis",desc:"Hlava z figuríny, na níž jsou připevněny měřicí a technické předměty: pravítko, součástky hodinek, části psacího stroje a fotoaparátu.",
 link:{l:"O autorovi (Wikipedia)",u:S.hausmann.u},
 fields:[F("Autor","Raoul Hausmann",["Hannah Höch","George Grosz","Hugo Ball"]),
         F("Název","Mechanická hlava (Duch naší doby)",["Fontána","Zrada obrazů","Odjezd na Kytheru"]),
         dirF("Dada")],
 why:"Raoul Hausmann, kolem 1920, asambláž. Hausmann patřil k berlínskému dada a k průkopníkům fotomontáže. Říkalo se mu „Dadasoph“.",
 src:[S.hausmann]},

{type:"fields",sec:"popis",desc:"Reprodukce Mony Lisy s dokreslenými kníry a bradkou. Název je francouzská slovní hříčka.",
 link:{l:"O ready-made (Wikipedia)",u:S.ready.u},
 fields:[F("Autor","Marcel Duchamp",["Man Ray","Francis Picabia","Max Ernst"]),
         F("Název","L.H.O.O.Q.",["Fontána","Bicycle Wheel (Bicyklové kolo)","Parade amoureuse"]),
         dirF("Dada")],
 why:"Marcel Duchamp, 1919. Duchamp podobnými zásahy zpochybňoval, co se vůbec dá považovat za umění.",
 src:[S.ready]},

/* ---------- TEORIE: DADA ---------- */

    '<p class="foot">Průběh a výsledky se ukládají a zobrazují se na stránce <a href="../vysvedceni/">Vysvědčení</a>.</p>';
  $app.querySelectorAll(".mode").forEach(b => b.addEventListener("click", () => {
    const id = b.dataset.sec;
    const pool = id === "all" ? BANK : BANK.filter(q => q.sec === id);
    currentLabel = id === "all" ? "Celý test" : SECTIONS.find(s => s.id === id).name;
    begin(pool, id);
  }));
  loadPoints();
  window.scrollTo(0, 0);
}

function loadPoints() {
  if (typeof fetch !== "function") return;
  fetch("../vysvedceni/data.json?" + Date.now()).then(r => r.ok ? r.json() : Promise.reject()).then(d => {
    const el = document.getElementById("pts");
    if (!el) return;
    const mine = d.tests && d.tests[TEST_ID] ? d.tests[TEST_ID].points : (d.tests ? 0 : d.points);
    if (typeof mine !== "number") return;
    el.hidden = false;
    el.innerHTML = '<span>Body za tento test: ' + mine + " / " + d.goal + (mine >= d.goal ? " · zvládnuto" : "") + '</span><div class="track"><i style="width:' + mine + '%"></i></div>';
  }).catch(() => {});
}

function begin(pool, mode) {
  queue = shuffle(pool); qi = 0; results = [];
  sid = Math.random().toString(36).slice(2, 10);
  currentMode = mode || "all";
  ping({e: "start", n: queue.length, mode: currentMode, tw: BANK.reduce((a, q) => a + (q.fields ? q.fields.length : q.rows ? q.rows.length : q.items.length), 0)});
  show();
}

function show() {
  if (qi >= queue.length) return finish();
  const q = queue[qi];
  const pct = Math.round(qi / queue.length * 100);
  $app.innerHTML = '<div class="bar"><span>' + (qi + 1) + " / " + queue.length + '</span><div class="track"><i style="width:' + pct + '%"></i></div><button class="quit" id="quit">Konec</button></div><div id="stage"></div>';
  document.getElementById("quit").addEventListener("click", home);
  const stage = document.getElementById("stage");
  if (q.type === "fields") renderFields(q, stage);
  else if (q.type === "match") renderMatch(q, stage);
  else renderOrder(q, stage);
  window.scrollTo(0, 0);
}

function tagOf(q) { return SECTIONS.find(s => s.id === q.sec).name; }

function feedback(q, pts, max) {
  const cls = pts === max ? "good" : "bad";
  const head = pts === max ? "Správně" : "Správně " + pts + " z " + max;
  return '<div class="fb ' + cls + '"><strong>' + head + "</strong><p>" + esc(q.why) + "</p>" + srcHtml(q.src) + "</div>";
}

function nextBtn(stage, done) {
  const last = qi === queue.length - 1;
  const row = el('<div class="act"><button class="btn" id="next">' + (last ? "Zobrazit výsledek" : "Další otázka") + "</button></div>");
  stage.querySelector(".card").appendChild(row);
  row.querySelector("#next").addEventListener("click", () => { qi++; show(); });
  row.querySelector("#next").focus();
}

/* --- chips (autor/název/směr, i obyčejné ABCD) --- */
function renderFields(q, stage) {
  const picks = q.fields.map(() => -1);
  const opts = q.fields.map(f => shuffle(f.o.map((t, i) => ({t, ok: i === f.a}))));
  let head = '<div class="tag">' + esc(tagOf(q)) + "</div>";
  if (q.prompt) head += '<p class="prompt">' + esc(q.prompt) + "</p>";
  if (q.file) head += '<figure class="fig" id="fig"><img id="pic" alt="Dílo k určení" src="' + esc(imgUrl(q.file)) + '"><figcaption>Určete autora, název a směr.</figcaption></figure>';
  if (q.desc) head += '<p class="desc">' + esc(q.desc) + "</p>" + (q.link ? '<div class="src"><a href="' + esc(q.link.u) + '" target="_blank" rel="noopener">' + esc(q.link.l) + "</a></div>" : "");
  const fieldsHtml = q.fields.map((f, fi) =>
    '<div class="field">' + (f.label ? '<div class="lab">' + esc(f.label) + "</div>" : "") + '<div class="chips" data-f="' + fi + '">' +
    opts[fi].map((o, oi) => '<button class="chip" aria-pressed="false" data-o="' + oi + '">' + esc(o.t) + "</button>").join("") + "</div></div>").join("");
  const card = el('<div class="card">' + head + fieldsHtml + '<div class="act"><button class="btn" id="check" disabled>Zkontrolovat</button></div><div id="fbslot"></div></div>');
  stage.appendChild(card);
  const pic = card.querySelector("#pic");
  if (pic) pic.addEventListener("error", () => {
    card.querySelector("#fig").outerHTML = '<div class="imgfail">Obrázek se nenačetl. <a href="' + esc(filePage(q.file)) + '" target="_blank" rel="noopener">Otevři ho na Wikimedia Commons</a> a pak odpověz.</div>';
  });
  const check = card.querySelector("#check");
  card.querySelectorAll(".chips").forEach(box => box.addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b || b.disabled) return;
    const fi = +box.dataset.f;
    picks[fi] = +b.dataset.o;
    box.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c === b)));
    check.disabled = picks.some(p => p < 0);
  }));
  check.addEventListener("click", () => {
    let pts = 0;
    card.querySelectorAll(".chips").forEach(box => {
      const fi = +box.dataset.f;
      box.querySelectorAll(".chip").forEach((c, oi) => {
        c.disabled = true;
        const o = opts[fi][oi];
        if (o.ok) c.classList.add("ok");
        else if (oi === picks[fi]) c.classList.add("no");
      });
      if (opts[fi][picks[fi]].ok) pts++;
    });
    check.parentElement.remove();
    const cap = card.querySelector("figcaption");
    if (cap && q.file) cap.innerHTML = 'Obrázek: <a href="' + esc(filePage(q.file)) + '" target="_blank" rel="noopener">Wikimedia Commons</a> (volné dílo)';
    card.querySelector("#fbslot").innerHTML = feedback(q, pts, q.fields.length);
    results.push({q, pts, max: q.fields.length});
    logAns(q, pts, q.fields.length);
    nextBtn(stage);
  });
}

/* --- přiřazování --- */
function renderMatch(q, stage) {
  const order = shuffle(q.pool.map((t, i) => i));
  const rows = q.rows.map((r, ri) =>
    '<div class="row"><label for="m' + ri + '">' + esc(r.l) + '</label><select id="m' + ri + '" data-r="' + ri + '"><option value="">Vyber…</option>' +
    order.map(i => '<option value="' + i + '">' + esc(q.pool[i]) + "</option>").join("") + "</select></div>").join("");
  const card = el('<div class="card"><div class="tag">' + esc(tagOf(q)) + '</div><p class="prompt">' + esc(q.prompt) + "</p>" + rows + '<div class="act"><button class="btn" id="check" disabled>Zkontrolovat</button></div><div id="fbslot"></div></div>');
  stage.appendChild(card);
  const sels = [...card.querySelectorAll("select")];
  const check = card.querySelector("#check");
  sels.forEach(s => s.addEventListener("change", () => { check.disabled = sels.some(x => x.value === ""); }));
  check.addEventListener("click", () => {
    let pts = 0;
    sels.forEach((s, ri) => {
      s.disabled = true;
      const right = q.rows[ri].a;
      if (+s.value === right) { s.classList.add("ok"); pts++; }
      else { s.classList.add("no"); s.parentElement.appendChild(el('<div class="fix">Správně: ' + esc(q.pool[right]) + "</div>")); }
    });
    check.parentElement.remove();
    card.querySelector("#fbslot").innerHTML = feedback(q, pts, q.rows.length);
    results.push({q, pts, max: q.rows.length});
    logAns(q, pts, q.rows.length);
    nextBtn(stage);
  });
}

/* --- časová osa --- */
function renderOrder(q, stage) {
  let items = shuffle(q.items);
  while (items.every((x, i) => x === q.items[i]) && q.items.length > 1) items = shuffle(q.items);
  const card = el('<div class="card"><div class="tag">' + esc(tagOf(q)) + '</div><p class="prompt">' + esc(q.prompt) + '</p><ol class="ord" id="ord"></ol><div class="act"><button class="btn" id="check">Zkontrolovat</button></div><div id="fbslot"></div></div>');
  stage.appendChild(card);
  const ol = card.querySelector("#ord");
  function draw() {
    ol.innerHTML = "";
    items.forEach((it, i) => {
      const li = el('<li><span>' + esc(it.t) + '</span><span class="mv"><button aria-label="Posunout výš"' + (i === 0 ? " disabled" : "") + '>▲</button><button aria-label="Posunout níž"' + (i === items.length - 1 ? " disabled" : "") + ">▼</button></span></li>");
      const [up, down] = li.querySelectorAll("button");
      up.addEventListener("click", () => { [items[i - 1], items[i]] = [items[i], items[i - 1]]; draw(); });
      down.addEventListener("click", () => { [items[i + 1], items[i]] = [items[i], items[i + 1]]; draw(); });
      ol.appendChild(li);
    });
  }
  draw();
  card.querySelector("#check").addEventListener("click", () => {
    const sorted = q.items.slice().sort((a, b) => a.y - b.y);
    let pts = 0;
    ol.innerHTML = "";
    items.forEach((it, i) => {
      const ok = it.y === sorted[i].y;
      if (ok) pts++;
      ol.appendChild(el('<li class="' + (ok ? "ok" : "no") + '"><span><span class="yr">' + it.y + "</span>" + esc(it.t) + "</span><span></span></li>"));
    });
    const fix = pts < items.length ? '<p>Správné pořadí: ' + sorted.map(s => s.y).join(" → ") + "</p>" : "";
    card.querySelector(".act").remove();
    card.querySelector("#fbslot").innerHTML = feedback(q, pts, items.length).replace("</div>", fix + "</div>");
    results.push({q, pts, max: items.length});
    logAns(q, pts, items.length);
    nextBtn(stage);
  });
}

/* --- výsledek --- */
function correctText(q) {
  if (q.type === "fields") return q.fields.map(f => (f.label ? f.label + ": " : "") + f.o[f.a]).join(" · ");
  if (q.type === "match") return q.rows.map(r => r.l + " → " + q.pool[r.a]).join(" · ");
  return q.items.slice().sort((a, b) => a.y - b.y).map(i => i.y + " " + i.t).join(" → ");
}
function labelOf(q) {
  if (q.prompt) return q.prompt;
  if (q.desc) return "Dílo: " + q.desc;
  if (q.file) return "Dílo na obrázku (" + q.fields[0].o[0] + ")";
  return tagOf(q);
}
function finish() {
  const pts = results.reduce((a, r) => a + r.pts, 0), max = results.reduce((a, r) => a + r.max, 0);
  const pct = max ? Math.round(pts / max * 100) : 0;
  ping({e: "end", p: pts, x: max, mode: currentMode});
  const bySec = SECTIONS.map(s => {
    const r = results.filter(x => x.q.sec === s.id);
    if (!r.length) return "";
    const p = r.reduce((a, x) => a + x.pts, 0), m = r.reduce((a, x) => a + x.max, 0);
    return "<tr><td>" + esc(s.name) + "</td><td>" + p + " / " + m + "</td></tr>";
  }).join("");
  const wrong = results.filter(r => r.pts < r.max);
  const mist = wrong.length ? '<h2 class="prompt">K zopakování</h2><ul class="mist">' + wrong.map(r => "<li><b>" + esc(labelOf(r.q)) + "</b><span>" + esc(correctText(r.q)) + "</span></li>").join("") + "</ul>" : '<p class="prompt">Bez chyby.</p>';
  $app.innerHTML = '<div class="card"><div class="tag">' + esc(currentLabel) + '</div><div class="score">' + pct + "<small> %</small></div><p>" + pts + " z " + max + ' bodů</p><table class="sec">' + bySec + "</table>" + mist +
    '<div class="act">' + (wrong.length ? '<button class="btn" id="redo">Zopakovat chyby</button>' : "") + '<button class="btn ghost" id="again">Znovu stejnou část</button><button class="btn ghost" id="menu">Zpět na výběr</button><a class="btn ghost" href="../vysvedceni/">Vysvědčení</a></div></div>';
  const doneQs = results.map(r => r.q);
  if (wrong.length) document.getElementById("redo").addEventListener("click", () => begin(wrong.map(r => r.q), "redo"));
  document.getElementById("again").addEventListener("click", () => begin(doneQs, "again"));
  document.getElementById("menu").addEventListener("click", home);
  window.scrollTo(0, 0);
}

home();
</script>
</body>
